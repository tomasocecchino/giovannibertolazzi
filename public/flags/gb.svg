<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Sfondo blu -->
  <rect width="100%" height="100%" fill="#00247d"/>

  <!-- Croce di San Giorgio (Inghilterra) -->
  <g fill="none" stroke="white" stroke-width="60">
    <path d="M300 0 V300 M0 150 H600" />
  </g>
  <g fill="none" stroke="#CF142B" stroke-width="40">
    <path d="M300 0 V300 M0 150 H600" />
  </g>
  
  <!-- Croce di Sant'Andrea (Scozia) -->
  <g fill="none" stroke="white" stroke-width="60">
     <path d="M0 0 L600 300 M0 300 L600 0"/>
  </g>

  <!-- Croce di San Patrizio (Irlanda) -->
  <g fill="none" stroke="#CF142B" stroke-width="20">
   <path d="M0,0 l600,300 M0,300 l600,-300" transform="rotate(0 300 150)"/>
  </g>
</svg>
